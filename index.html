        <button class="btn btn-ghost" style="justify-content:flex-start" data-go="tests">📝 Go to Tests</button>
        <button class="btn btn-ghost" style="justify-content:flex-start" data-go="notes">📄 Go to Notes &amp; Assignments</button>
      </div>
    </div>
  `);
  links.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    STATE.studentTab = b.dataset.go;
    renderScreen();
  });
  container.appendChild(links);
}

/* Shown on the Dashboard whenever the student has no active batch.
   Lists active batches matching the student's registered class (falling
   back to all active batches if no class was set, or none match), each
   with a "Request to join" action — this only ever creates a request;
   an admin still has to approve it before an enrollment is created. */
function renderAvailableBatches(box){
  const p = CURRENT_PROFILE;
  box.innerHTML = '<div class="spinner"></div>';
  Promise.all([
    db.collection(COL.batches).where('status','==','active').get(),
    db.collection(COL.batchJoinRequests).where('studentId','==',CURRENT_USER.uid).get()
  ]).then(([batchSnap, reqSnap])=>{
    let batches = []; batchSnap.forEach(d=> batches.push({id:d.id, ...d.data()}));
    const pendingBatchIds = new Set();
    reqSnap.forEach(d=>{ const r=d.data(); if(r.status==='pending') pendingBatchIds.add(r.batchId); });

    const studentClass = (p.class||'').trim();
    let shown = batches;
    let note = 'All available batches';
    if(studentClass){
      const matched = batches.filter(b=> (b.class||'').trim() === studentClass);
      if(matched.length){ shown = matched; note = 'Batches for Class ' + esc(studentClass); }
    }

    box.innerHTML = '';
    if(!shown.length){ return; } // nothing to show — stay quiet rather than an empty card
    const card = el(`<div class="card">
      <div class="card-title">📚 ${note}</div>
      <div id="availBatchList"></div>
    </div>`);
    box.appendChild(card);
    const list = $('#availBatchList', card);
    shown.forEach(b=>{
      const pending = pendingBatchIds.has(b.id);
      const row = el(`<div class="enroll-row">
        <div class="enroll-info"><div class="enroll-name">${esc(b.name)}</div>${b.description?`<div class="enroll-meta">${esc(b.description)}</div>`:''}</div>
        ${pending ? '<span class="badge badge-accent">⏳ Requested</span>' : '<button class="btn-sm btn-success">Request to join</button>'}
      </div>`);
      if(!pending){
        $('button', row).addEventListener('click', ()=> requestBatchJoin(b, box));
      }
      list.appendChild(row);
    });
  }).catch(err=>{ console.error(err); box.innerHTML=''; });
}

async function requestBatchJoin(batch, box){
  try{
    await db.collection(COL.batchJoinRequests).add({
      studentId: CURRENT_USER.uid, studentName: CURRENT_PROFILE.fullName||'',
      batchId: batch.id, batchName: batch.name,
      status:'pending', requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('Request sent for ' + batch.name);
    renderAvailableBatches(box);
  }catch(e){
    console.error(e);
    toast('Could not send request — check your connection.');
  }
}

/* ================================================================
   BATCH-AWARE CONTENT ACCESS (Phase D)
   ----------------------------------------------------------------
   The source of truth for "what batches is this student in" is their
   ACTIVE, non-expired enrollments — but Firestore Security Rules cannot
   run a where() query against `enrollments` to check this for a list
   read (rules can only get() ONE deterministic document, not query a
   collection). So students/{uid}.activeBatchIds is maintained as a
   plain array — the one thing a security rule CAN check with a single
   get() — and every content query is constrained to it with
   where('batchId','in',[...]) so Firestore itself, not just this
   JavaScript, refuses to return anything outside it. See
   firestore.rules for the enforcement side of this.
   ================================================================ */
const GENERAL_BATCH_ID = '__general__'; // sentinel batchId: content visible to every active student
                                          // (must exactly match the literal used in firestore.rules)

/* Given a student's enrollment documents, returns the Set of batchIds
   they currently have valid access to (status active, and — for a fixed
   expiry — not yet expired), always including the general marker. */
function computeValidBatchIds(enrollmentDocs){
  const ids = new Set([GENERAL_BATCH_ID]);
  const now = Date.now();
  enrollmentDocs.forEach(e=>{
    if(e.status !== 'active') return; // suspended, or any other non-active status
    if(e.expiryType === 'fixed' && e.expiresAt){
      const expMs = e.expiresAt.toDate ? e.expiresAt.toDate().getTime() : new Date(e.expiresAt).getTime();
      if(expMs <= now) return; // expired
    }
    if(e.batchId) ids.add(e.batchId);
  });
  return ids;
}

/* ADMIN-PRIVILEGED. Recomputes and overwrites one student's
   activeBatchIds from their current enrollments. Firestore rules only
   let a student SHRINK their own array (see firestore.rules), so
   granting access — a new enrollment, reactivating a suspended one —
   can only be written by an admin. Call this after every enrollment
   create/suspend/reactivate/delete and after deleting a batch, so the
   authorization map never drifts from the real enrollment data. */
async function syncStudentActiveBatchIds(studentId){
  try{
    const snap = await db.collection(COL.enrollments).where('studentId','==',studentId).get();
    const docs = []; snap.forEach(d=> docs.push(d.data()));
    const ids = Array.from(computeValidBatchIds(docs));
    await db.collection(COL.students).doc(studentId).update({ activeBatchIds: ids });
  }catch(e){
    console.error('[batch-access] could not sync activeBatchIds for', studentId, e);
  }
}

/* STUDENT-SIDE. Re-reads this student's own activeBatchIds (fresh from
   Firestore, not the possibly-stale in-memory CURRENT_PROFILE) and their
   current enrollments, then trims any id that's no longer valid — a
   fixed-term enrollment that just expired shouldn't have to wait for an
   admin to notice. This can only ever SHRINK the array (rules enforce
   that), never grant anything new; a freshly-approved enrollment an
   admin hasn't synced yet simply isn't visible until they do, or until
   the student's next login after that sync — fail-closed by design.
   Returns the ids that are SAFE to query content with right now (i.e.
   already present in the server-side record), or [] if none. */
async function syncAndGetMyBatchIds(){
  let current = [];
  try{
    const selfDoc = await db.collection(COL.students).doc(CURRENT_USER.uid).get();
    current = (selfDoc.exists && Array.isArray(selfDoc.data().activeBatchIds)) ? selfDoc.data().activeBatchIds : [];
  }catch(e){
    console.error('[batch-access] could not read own activeBatchIds, failing closed:', e);
    return [];
  }
  if(!current.length) return [];
  let validIds;
  try{
    const snap = await db.collection(COL.enrollments).where('studentId','==',CURRENT_USER.uid).get();
    const docs = []; snap.forEach(d=> docs.push(d.data()));
    validIds = computeValidBatchIds(docs);
  }catch(e){
    console.error('[batch-access] could not load enrollments, using last-known access only:', e);
    return current; // a transient read failure shouldn't punish already-granted access
  }
  const shrunk = current.filter(id => validIds.has(id));
  if(shrunk.length !== current.length){
    db.collection(COL.students).doc(CURRENT_USER.uid).update({ activeBatchIds: shrunk })
      .catch(e=> console.error('[batch-access] self-shrink write failed (non-blocking):', e));
  }
  return shrunk;
}

/* Firestore's `in` operator accepts at most 30 values. Sets up one
   real-time listener per chunk of batchIds — for this app's scale a
   student almost never has more than a couple of batches, so this is
   normally a single listener, but it stays correct if that changes —
   and calls onChange with the merged, de-duplicated result set whenever
   any chunk updates, preserving the app's existing live-update behavior
   instead of downgrading content tabs to a one-time fetch. Returns an
   unsubscribe function that stops all of them; register it with
   trackUnsub() same as any other listener.

   extraWhere is an optional {field, value} always applied on top of the
   batchId filter (e.g. {field:'active', value:true} for announcements) —
   whatever the matching firestore.rules rule checks beyond batch
   authorization, the query must constrain the same way, or Firestore
   rejects the whole query as unprovable (see firestore.rules' comments). */
function listenContentByBatchIds(collectionName, batchIds, extraWhere, onChange, onError){
  if(!batchIds.length){ onChange([]); return ()=>{}; }
  const chunks = [];
  for(let i=0;i<batchIds.length;i+=30) chunks.push(batchIds.slice(i,i+30));
  const chunkResults = chunks.map(()=> []);
  function emit(){
    const seen = new Set(), merged = [];
    chunkResults.forEach(list=> list.forEach(item=>{
      if(seen.has(item.id)) return; seen.add(item.id); merged.push(item);
    }));
    onChange(merged);
  }
  const unsubs = chunks.map((chunk, i) => {
    let q = db.collection(collectionName).where('batchId','in',chunk);
    if(extraWhere) q = q.where(extraWhere.field,'==',extraWhere.value);
    return q.onSnapshot(snap=>{
      chunkResults[i] = []; snap.forEach(d=> chunkResults[i].push({id:d.id, ...d.data()}));
      emit();
    }, err=>{ console.error(err); if(onError) onError(err); });
  });
  return ()=> unsubs.forEach(u=>u());
}

/* ================================================================
   CALENDAR / CLASS SCHEDULE (Phase F)
   ----------------------------------------------------------------
   New students/{uid}.activeBatchIds + GENERAL_BATCH_ID authorization
   model — same as Classes/Tests/Notes/Announcements, nothing new. Kept
   as a separate collection (classSchedules) from liveClasses: liveClasses
   is specifically "join this live video call" (single time, meetLink,
   upcoming/live/ended status); the Calendar is the broader "what's
   happening when" schedule (start+end time, topic, cancel/reschedule).
   Merging them would have meant reworking liveClasses' existing status
   model and risking its working join-link flow for no real benefit —
   they can both describe the same real class if an admin wants, but
   nothing here links or syncs them automatically.

   listenScheduleByBatchIds() is intentionally separate from
   listenContentByBatchIds() rather than extending it: a monthly
   calendar needs an additional date-range constraint that helper was
   never built for, and changing its signature would mean touching five
   already-working call sites (videos/liveClasses/tests/notes/
   announcements) for the sake of one new one. Requires a composite
   Firestore index on classSchedules (batchId, date) — see the summary
   for the one-time setup step. */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayYMD(){ const t=new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); }

function listenScheduleByBatchIds(batchIds, firstDay, lastDay, onChange, onError){
  if(!batchIds.length){ onChange([]); return ()=>{}; }
  const chunks = [];
  for(let i=0;i<batchIds.length;i+=30) chunks.push(batchIds.slice(i,i+30));
  const chunkResults = chunks.map(()=> []);
  function emit(){
    const seen = new Set(), merged = [];
    chunkResults.forEach(list=> list.forEach(item=>{
      if(seen.has(item.id)) return; seen.add(item.id); merged.push(item);
    }));
    onChange(merged);
  }
  const unsubs = chunks.map((chunk, i) =>
    db.collection(COL.classSchedules)
      .where('batchId','in',chunk)
      .where('date','>=',firstDay)
      .where('date','<=',lastDay)
      .onSnapshot(snap=>{
        chunkResults[i] = []; snap.forEach(d=> chunkResults[i].push({id:d.id, ...d.data()}));
        emit();
      }, err=>{ console.error(err); if(onError) onError(err); })
  );
  return ()=> unsubs.forEach(u=>u());
}

/* ================================================================
   RECURRING WEEKLY SCHEDULES (Phase F.2)
   ----------------------------------------------------------------
   Stored as a SEPARATE collection, classScheduleRules — one document
   per recurring series (e.g. "every Tue+Sun, 1 Oct - 31 Dec"), never
   as individual generated classSchedules documents. The Student
   Calendar expands each rule into virtual per-day occurrences,
   client-side, only for the month currently being viewed — see
   expandRuleOccurrences() below. Nothing is ever written to Firestore
   for an individual occurrence; the only writes are to the rule
   itself (create/edit/pause/delete) and to its `overrides` map for a
   one-off cancel/reschedule (see makeRuleOccurrence()).

   Read access follows the EXACT same batchId/activeBatchIds shape as
   classSchedules (see firestore.rules) — reusing listenContentByBatchIds()
   with extraWhere {field:'status', value:'active'} is deliberate: that's
   an equality filter on top of the existing batchId 'in' filter, same
   shape as the already-working announcements query, so it doesn't need
   the kind of composite index classSchedules needed for its date RANGE
   filter. If Firestore's console says otherwise when this is first
   exercised, the calendar's error handler below will show the direct
   "create it here" link — same as it did for the original index issue.

   Day-of-week convention (must match firestore.rules comments and the
   admin picker): 0=Sunday .. 6=Saturday, i.e. plain JS Date#getDay().
   ================================================================ */

function daysOfWeekLabel(daysArr){
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sorted = (daysArr||[]).slice().sort((a,b)=>a-b);
  if(!sorted.length) return '';
  return 'Every ' + sorted.map(i=>names[i]||'?').join(' & ');
}

/* Turns ONE recurring rule document into virtual occurrence objects,
   shaped exactly like a classSchedules document (same fields
   renderCalendarGrid()/renderDaySchedule() already read), for every
   date in [firstDay,lastDay] the rule actually falls on. All date math
   uses local Date(year,monthIndex,day) components — never parses a
   "YYYY-MM-DD" string straight into `new Date(...)`, which can shift
   the date by the viewer's timezone offset — so a class stays on the
   day it says regardless of the student's browser timezone. */
function expandRuleOccurrences(rule, firstDay, lastDay){
  const out = [];
  if(!rule.startDate || !rule.endDate || !Array.isArray(rule.daysOfWeek)) return out;
  const overrides = rule.overrides || {};
  const start = rule.startDate > firstDay ? rule.startDate : firstDay;
  const end = rule.endDate < lastDay ? rule.endDate : lastDay;

  if(start <= end){
    const [sy,sm,sd] = start.split('-').map(Number);
    const [ey,em,ed] = end.split('-').map(Number);
    let cur = new Date(sy, sm-1, sd);
    const endDate = new Date(ey, em-1, ed);
    while(cur <= endDate){
      if(rule.daysOfWeek.includes(cur.getDay())){
        const dateStr = ymd(cur.getFullYear(), cur.getMonth(), cur.getDate());
        const ov = overrides[dateStr];
        if(!ov){
          out.push(makeRuleOccurrence(rule, dateStr, dateStr, 'scheduled', null));
        } else if(ov.status === 'cancelled'){
          out.push(makeRuleOccurrence(rule, dateStr, dateStr, 'cancelled', null));
        }
        // ov.status === 'rescheduled': nothing shows on the original date —
        // the moved occurrence is injected below, keyed by its NEW date.
      }
      cur.setDate(cur.getDate()+1);
    }
  }

  // Rescheduled occurrences are checked against the visible range by their
  // NEW date, independently of the day-of-week loop above — this is what
  // makes a class moved across a month boundary show up in the month it
  // was moved TO (and correctly disappear from the month it was moved FROM).
  Object.keys(overrides).forEach(origDate=>{
    const ov = overrides[origDate];
    if(ov && ov.status === 'rescheduled' && ov.newDate >= firstDay && ov.newDate <= lastDay){
      out.push(makeRuleOccurrence(rule, ov.newDate, origDate, 'scheduled', ov));
    }
  });

  return out;
}

function makeRuleOccurrence(rule, displayDate, originalDate, status, ov){
  return {
    id: 'rule_'+rule.id+'_'+originalDate, // stable ruleId+occurrenceDate identity
    ruleId: rule.id,
    isRecurring: true,
    originalDate: originalDate,
    batchId: rule.batchId,
    batchName: rule.batchName,
    date: displayDate,
    startTime: (ov && ov.startTime) || rule.startTime,
    endTime: (ov && ov.endTime) || rule.endTime,
    title: rule.title,
    topic: rule.topic,
    classType: rule.classType,
    teacher: rule.teacher,
    status: status,
    rescheduled: !!ov
  };
}

function renderCalendarTab(container){
  const now = new Date();
  if(STATE.calendarYear==null){ STATE.calendarYear = now.getFullYear(); STATE.calendarMonthIdx = now.getMonth(); }
  if(!STATE.calendarSelectedDate) STATE.calendarSelectedDate = todayYMD();

  const y = STATE.calendarYear, m = STATE.calendarMonthIdx;
  const firstDay = ymd(y,m,1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const lastDay = ymd(y,m,daysInMonth);
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const header = el(`<div class="cal-header">
    <button class="btn-sm btn-ghost" id="calPrev">◀</button>
    <div class="cal-title">${monthNames[m]} ${y}</div>
    <button class="btn-sm btn-ghost" id="calNext">▶</button>
  </div>`);
  container.appendChild(header);
  const grid = el(`<div id="calGrid"></div>`);
  container.appendChild(grid);
  const dayList = el(`<div id="calDayList"><div class="spinner"></div></div>`);
  container.appendChild(dayList);

  $('#calPrev', header).addEventListener('click', ()=>{
    STATE.calendarMonthIdx--;
    if(STATE.calendarMonthIdx<0){ STATE.calendarMonthIdx=11; STATE.calendarYear--; }
    renderScreen();
  });
  $('#calNext', header).addEventListener('click', ()=>{
    STATE.calendarMonthIdx++;
    if(STATE.calendarMonthIdx>11){ STATE.calendarMonthIdx=0; STATE.calendarYear++; }
    renderScreen();
  });

  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length){ grid.innerHTML=''; dayList.innerHTML = '<div class="empty-state">Your batch access isn\u2019t set up yet — ask your teacher.</div>'; return; }

    // Phase F.2: the calendar now merges TWO live sources — one-time
    // classSchedules (unchanged) and recurring classScheduleRules, expanded
    // client-side into virtual occurrences for just this visible month
    // (expandRuleOccurrences() above). Both are independent onSnapshot
    // listeners; either one updating re-renders the merged result. Neither
    // waits forever on the other — each starts from `[]`, so if one
    // collection is simply empty (e.g. no recurring rules yet) the other
    // still renders normally instead of hanging on a spinner.
    let oneTimeItems = [], ruleDocs = [], loadError = null;

    function showLoadError(err){
      // Same diagnostic error surfacing as the original one-time-only
      // calendar fix — see comment history above expandRuleOccurrences().
      const code = err && err.code;
      let msg = 'Could not load — check your connection.';
      if(code === 'failed-precondition'){
        msg = 'Calendar setup incomplete — a database index is missing. Open the browser console for a link to create it.';
      } else if(code === 'permission-denied'){
        msg = 'Could not load your schedule — your batch access may be out of date. Try logging out and back in.';
      }
      grid.innerHTML = '';
      dayList.innerHTML = `<div class="empty-state">${esc(msg)}</div>`;
    }

    function renderMerged(){
      if(loadError){ showLoadError(loadError); return; }
      const recurringOccurrences = [];
      ruleDocs.forEach(rule=> recurringOccurrences.push(...expandRuleOccurrences(rule, firstDay, lastDay)));
      const merged = oneTimeItems.concat(recurringOccurrences);
      renderCalendarGrid(grid, y, m, merged);
      renderDaySchedule(dayList, merged);
    }

    const unsub1 = listenScheduleByBatchIds(ids, firstDay, lastDay, items=>{
      oneTimeItems = items; renderMerged();
    }, (err)=>{ loadError = err; renderMerged(); });
    trackUnsub(unsub1);

    const unsub2 = listenContentByBatchIds(COL.classScheduleRules, ids, {field:'status', value:'active'}, items=>{
      ruleDocs = items; renderMerged();
    }, (err)=>{ loadError = err; renderMerged(); });
    trackUnsub(unsub2);
  });
}

function renderCalendarGrid(grid, y, m, items){
  const datesWithClasses = new Set(items.map(i=>i.date));
  const firstWeekday = (new Date(y,m,1).getDay()+6)%7; // 0=Mon .. 6=Sun
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayYMD();

  let html = `<div class="cal-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-days">`;
  for(let i=0;i<firstWeekday;i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = ymd(y,m,d);
    const has = datesWithClasses.has(dateStr);
    const isToday = dateStr===today;
    const isSelected = dateStr===STATE.calendarSelectedDate;
    html += `<div class="cal-day${isToday?' cal-today':''}${isSelected?' cal-selected':''}" data-date="${dateStr}">
      <span>${d}</span>${has?'<span class="cal-dot"></span>':''}
    </div>`;
  }
  html += `</div>`;
  grid.innerHTML = html;
  $all('.cal-day[data-date]', grid).forEach(cell=> cell.addEventListener('click', ()=>{
    STATE.calendarSelectedDate = cell.dataset.date;
    renderScreen();
  }));
}

function renderDaySchedule(box, items){
  const dayItems = items.filter(i=> i.date === STATE.calendarSelectedDate)
    .sort((a,b)=> (a.startTime||'').localeCompare(b.startTime||''));
  const d = new Date(STATE.calendarSelectedDate+'T00:00:00');
  const label = d.toLocaleDateString('en-GB',{day:'2-digit',month:'long'});
  box.innerHTML = `<div class="card-title" style="margin:14px 0 8px">${esc(label)}</div>`;
  if(!dayItems.length){
    box.appendChild(el(`<div class="empty-state">No classes scheduled.</div>`));
    return;
  }
  dayItems.forEach(c=>{
    const cancelled = c.status === 'cancelled';
    const card = el(`<div class="item-card">
      <div class="item-top"><div class="item-icon">${cancelled?'🚫':'📅'}</div><div class="item-info">
        <div class="item-title" style="${cancelled?'text-decoration:line-through;opacity:.6':''}">${esc(c.title||'Class')}</div>
        <div class="item-meta">${esc(c.startTime||'')} – ${esc(c.endTime||'')}${c.topic?(' · '+esc(c.topic)):''}${c.teacher?(' · '+esc(c.teacher)):''}</div>
        <div class="item-badges">
          <span class="badge badge-muted">${esc(c.batchName||'')}</span>
          ${cancelled?'<span class="badge badge-paid">CANCELLED</span>':''}
          ${(c.rescheduled && !cancelled)?'<span class="badge badge-muted">Rescheduled</span>':''}
          ${c.classType?`<span class="badge badge-muted">${esc(c.classType)}</span>`:''}
        </div>
      </div></div>
    </div>`);
    box.appendChild(card);
  });
}

function renderClassesTab(container){
  const subTabs = el(`<div class="tab-filter">
    <button data-sub="recorded">📹 Recorded</button>
    <button data-sub="live">🔴 Live Class</button>
  </div>`);
  $all('button', subTabs).forEach(b=> b.classList.toggle('active', b.dataset.sub===STATE.classesSubTab));
  subTabs.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    STATE.classesSubTab = b.dataset.sub;
    renderScreen();
  });
  container.appendChild(subTabs);

  const listBox = el(`<div><div class="spinner"></div></div>`);
  container.appendChild(listBox);

  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length){ listBox.innerHTML = '<div class="empty-state">Your batch access isn\u2019t set up yet — ask your teacher.</div>'; return; }
    if(STATE.classesSubTab === 'recorded'){
      const unsub = listenContentByBatchIds(COL.videos, ids, null, items=> renderVideoList(listBox, items),
        ()=>{ listBox.innerHTML = '<div class="empty-state">Could not load — check your connection.</div>'; });
      trackUnsub(unsub);
    } else {

        items.sort((a,b)=> (a.status==='live'?0:1) - (b.status==='live'?0:1));
        renderLiveList(listBox, items);
      }, ()=>{ listBox.innerHTML = '<div class="empty-state">Could not load — check your connection.</div>'; });
      trackUnsub(unsub);
    }
  });
}

function renderVideoList(box, items){
  box.innerHTML = '';
  if(!items.length){ box.appendChild(el(`<div class="empty-state"><div class="icon">🎬</div>No recorded classes yet.</div>`)); return; }
  items.forEach(v=>{
    const card = el(`
      <div class="item-card">
        <div class="item-top">

/* Pulls the file ID out of any common Google Drive share-link format:
   .../file/d/ID/view   or   ...?id=ID   or   .../open?id=ID */
function driveIdFromUrl(url){
  url = (url||'').trim();
  let m = url.match(/\/file\/d\/([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  m = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return m[1];
  return url; // maybe they already pasted just the raw ID
}

/* Populates a <select> with a "visible to every student" option plus

   without needing a batch/enrollment at all. One-time fetch (matches the

function loadActiveBatchesInto(selectEl){

/* ================================================================
   ANNOUNCEMENTS (Phase E)
   ----------------------------------------------------------------
   Same batch-authorization model as Classes/Tests/Notes: the query is
   constrained to the student's own activeBatchIds (which always
   includes GENERAL_BATCH_ID), and firestore.rules independently
   re-verifies that server-side — see listenContentByBatchIds() and
   firestore.rules' announcements section. Read state is a lightweight,
   self-only array on the student's own document (students/{uid}.
   readAnnouncementIds) — already permitted by the existing self-update
   rule, since it isn't one of the three locked fields (membership,
   active, activeBatchIds), so no rules change was needed for it.
   ================================================================ */
function renderAnnouncementsTab(container){
  const listBox = el(`<div><div class="spinner"></div></div>`);
  container.appendChild(listBox);
  syncAndGetMyBatchIds().then(ids=>{
    if(!ids.length){ listBox.innerHTML = '<div class="empty-state">Your batch access isn\u2019t set up yet — ask your teacher.</div>'; return; }
    const unsub = listenContentByBatchIds(COL.announcements, ids, {field:'active', value:true}, items=>{
      items.sort((a,b)=>{
        const at = (a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0;
        const bt = (b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0;
        return bt - at; // newest first
      });
      renderAnnouncementsList(listBox, items);
    }, ()=>{ listBox.innerHTML = '<div class="empty-state">Could not load — check your connection.</div>'; });
    trackUnsub(unsub);
  });
}

  box.innerHTML='';

  items.forEach(a=>{
    const isUnread = !readIds.has(a.id);
    const card = el(`<div class="item-card" style="cursor:pointer">

.opt.sel{border-color:#7f77dd;background:rgba(127,119,221,.15)}
.key{width:20px;height:20px;border-radius:50%;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.nb{padding:10px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:#1c2333;color:#e6edf3}
.submit{width:100%;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.result{background:#161b22;border-radius:10px;padding:16px;text-align:center}
.score{font-size:32px;font-weight:700;color:#7f77dd;margin:8px 0}
.sol{background:#161b22;border-radius:10px;padding:12px;margin-top:10px}
.sol.correct{border-left:3px solid #22c55e}
.sol.wrong{border-left:3px solid #ef4444}
.sol.skip{border-left:3px solid #6b7280}
</style></head>
<body oncontextmenu="return false">
<div class="header"><div class="title">${meta.title?String(meta.title).replace(/</g,'&lt;'):'Test'}</div><div class="timer" id="tm">--:--</div></div>
<div class="palette" id="palette"></div>
<div id="quizArea"></div>
<div class="navrow"><button class="nb" id="prevB">← Prev</button><button class="nb" id="nextB">Next →</button></div>
<button class="submit" id="submitB">Submit Test</button>
<div id="resultArea" style="display:none"></div>
<script>
const QUESTIONS = ${qData};
const CORRECT_MARK = ${correctMark}, WRONG_MARK = ${wrongMark};
let cur = 0;
let answers = new Array(QUESTIONS.length).fill(-1);
let secondsLeft = ${durationSec};
let submitted = false;
let timerHandle = null;

function renderQ(){
  const q = QUESTIONS[cur];
  const keys=['A','B','C','D'];
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card"><div class="q-num">Question '+(cur+1)+' of '+QUESTIONS.length+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+
    q.opts.map((o,i)=>'<div class="opt '+(answers[cur]===i?'sel':'')+'" onclick="selectOpt('+i+')"><div class="key">'+keys[i]+'</div><div>'+o+'</div></div>').join('')+
    '</div>';
  if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('quizArea')]);
  renderPalette();
}
function selectOpt(i){ answers[cur]=i; renderQ(); }
function renderPalette(){
  document.getElementById('palette').innerHTML = QUESTIONS.map(function(_,i){
    var cls = i===cur ? 'cur' : (answers[i]!==-1 ? 'done' : '');
    return '<button class="pb '+cls+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function jump(i){ cur=i; renderQ(); }
document.getElementById('prevB').onclick=function(){ if(cur>0){cur--;renderQ();} };
document.getElementById('nextB').onclick=function(){ if(cur<QUESTIONS.length-1){cur++;renderQ();} };
document.getElementById('submitB').onclick=submitTest;

function submitTest(){
  if(submitted) return; submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  var correct=0, wrong=0, skipped=0;
  QUESTIONS.forEach(function(q,i){
    if(answers[i]===-1) skipped++;
    else if(answers[i]===q.correct) correct++;
    else wrong++;
  });
  var score = correct*CORRECT_MARK + wrong*WRONG_MARK;
  var total = QUESTIONS.length*CORRECT_MARK;
  document.getElementById('quizArea').style.display='none';
  document.querySelector('.palette').style.display='none';
  document.querySelector('.navrow').style.display='none';
  document.getElementById('submitB').style.display='none';
  var keys=['A','B','C','D'];
  var solHtml = QUESTIONS.map(function(q,i){
    var a = answers[i];
    var cls = a===-1?'skip':(a===q.correct?'correct':'wrong');
    var statusText = a===-1?'Skipped':(a===q.correct?('Correct — '+keys[a]):('Your answer: '+keys[a]+' · Correct: '+keys[q.correct]));
    return '<div class="sol '+cls+'"><div class="q-text">'+(i+1)+'. '+q.text+'</div><div style="font-size:12px;margin:6px 0;font-weight:700">'+statusText+'</div>'+(q.explain?'<div style="font-size:12px;color:#8b949e">'+q.explain+'</div>':'')+'</div>';
  }).join('');
  document.getElementById('resultArea').style.display='block';
  document.getElementById('resultArea').innerHTML =
    '<div class="result"><div style="font-size:13px;color:#8b949e">Your score</div><div class="score">'+score+'</div><div style="font-size:12px;color:#8b949e">out of '+total+' · '+correct+' correct, '+wrong+' wrong, '+skipped+' skipped</div></div>'+solHtml;
  if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('resultArea')]);
  window.parent.postMessage({ type:'submit_test', score:score, total:total }, '*');
}

if(secondsLeft > 0){
  timerHandle = setInterval(function(){
    secondsLeft--;
    var m = Math.floor(secondsLeft/60).toString().padStart(2,'0');
    var s = (secondsLeft%60).toString().padStart(2,'0');
    var t = document.getElementById('tm'); if(t) t.textContent = m+':'+s;
    if(secondsLeft<=0){ submitTest(); }
  }, 1000);
} else {
  document.getElementById('tm').textContent = 'No limit';
}
renderQ();
<\/script>
</body></html>`;
}

/* Batch-join requests only now — paid-upgrade requests were removed:
   approved batch enrollment already means the student paid the teacher
   directly and was let in, so there was never a separate "paid" state
   left to track once membership stopped gating content (Phase F.5). */
function renderAdminUpgradeRequests(container){
  drawBatchJoinRequests(container);
}


function drawBatchJoinRequests(container){
  const listBox = el(`<div><div class="spinner"></div></div>`);
  container.appendChild(listBox);
  const unsub = db.collection(COL.batchJoinRequests).onSnapshot(snap=>{
    const items = []; snap.forEach(d=> items.push({id:d.id, ...d.data()}));
    items.sort((a,b)=> (a.status==='pending'?0:1) - (b.status==='pending'?0:1));
    listBox.innerHTML = '';
    if(!items.length){ listBox.appendChild(el(`<div class="empty-state"><div class="icon">📚</div>No batch join requests yet.</div>`)); return; }
    items.forEach(r=>{
      const badge = r.status==='pending' ? '<span class="badge badge-accent">⏳ Pending</span>'
        : r.status==='approved' ? '<span class="badge badge-free">✅ Approved</span>'
        : '<span class="badge badge-muted">✕ Rejected</span>';
      const card = el(`<div class="item-card">
        <div class="item-top">
          <div class="item-icon">${r.status==='pending'?'⏳':r.status==='approved'?'✅':'✕'}</div>
          <div class="item-info">
            <div class="item-title">${esc(r.studentName||'Student')}</div>
            <div class="item-meta">Wants to join: ${esc(r.batchName||'Batch')} · ${fmtDate(r.requestedAt)}</div>
            <div class="item-badges">${badge}</div>
          </div>
        </div>
        ${r.status==='pending' ? `<div class="item-actions">
          <button class="btn-sm btn-success" data-act="approve">✅ Approve</button>
          <button class="btn-sm btn-danger" data-act="reject">✕ Reject</button>
        </div>` : ''}
      </div>`);
      $all('button', card).forEach(b=> b.addEventListener('click', async ()=>{
        try{
          if(b.dataset.act === 'approve'){
            const batchDoc = await db.collection(COL.batches).doc(r.batchId).get();
            const batchData = batchDoc.exists ? batchDoc.data() : { defaultExpiryType:'lifetime', defaultExpiresAt:null };
            const existing = await db.collection(COL.enrollments).where('studentId','==',r.studentId).get();
            let already = false;
            existing.forEach(d=>{ if(d.data().batchId===r.batchId) already = true; });
            if(!already){
              await db.collection(COL.enrollments).add({
                studentId: r.studentId, batchId: r.batchId, batchName: r.batchName,
                status:'active', expiryType: batchData.defaultExpiryType||'lifetime', expiresAt: batchData.defaultExpiresAt||null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              await syncStudentActiveBatchIds(r.studentId);
            }
            await db.collection(COL.batchJoinRequests).doc(r.id).update({ status:'approved' });
            toast(already ? 'Already enrolled — request marked approved' : 'Approved — student enrolled');
          } else if(b.dataset.act === 'reject'){
            await db.collection(COL.batchJoinRequests).doc(r.id).update({ status:'rejected' });
            toast('Request rejected');
          }
        }catch(err){ console.error(err); toast('Action failed — check your connection.'); }
      }));
      listBox.appendChild(card);
    });
  });
  trackUnsub(unsub);
}


function renderAdminBatches(container){
  container.appendChild(el(`<div>

      <div class="field"><label>Batch name</label><input id="bName" placeholder="e.g. Class 12 Physics 2026"></div>

      <div class="field"><label>Default expiry for new enrollments</label></div>
      <div class="expiry-toggle" id="bExpiryToggle">
        <button type="button" class="active" data-v="lifetime">♾ Lifetime</button>
        <button type="button" data-v="fixed">📅 Fixed date</button>
      </div>

      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
        If students already have an old free-text batch name on their profile, run this once to create a
        matching batch for each distinct name and enroll those students into it (lifetime expiry, so nobody
        currently active loses access). This also (re)syncs every student's secure batch-access record from
        their current enrollments — run it again any time you want to force a resync (e.g. right after
        deploying this update, so existing students get access without you having to open each one).
        Safe to run more than once.
      </div>
      <button class="btn btn-ghost" id="runMigrationBtn">Migrate batch names &amp; sync access</button>
    </div>
    <div class="card-title" style="margin:14px 0 8px">All batches</div>
    <div id="batchList"><div class="spinner"></div></div>
  </div>`));

  let expiryMode = 'lifetime';
  const toggle = $('#bExpiryToggle', container);
  toggle.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    expiryMode = b.dataset.v;
    $all('button', toggle).forEach(x=> x.classList.toggle('active', x===b));
    $('#bExpiryDateField', container).style.display = expiryMode==='fixed' ? 'block' : 'none';
  });

  $('#createBatchBtn', container).addEventListener('click', async ()=>{
    const name = $('#bName', container).value.trim();
    if(!name){ toast('Enter a batch name'); return; }
    const expDateVal = $('#bExpiryDate',container).value;
    const defaultExpiresAt = (expiryMode==='fixed' && expDateVal)
      ? firebase.firestore.Timestamp.fromDate(new Date(expDateVal))
      : null;
    await db.collection(COL.batches).add({
      name, class: $('#bClass',container).value.trim(), description: $('#bDesc',container).value.trim(), status:'active',
      defaultExpiryType: expiryMode, defaultExpiresAt,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('Batch created');
    $('#bName',container).value=''; $('#bClass',container).value=''; $('#bDesc',container).value='';
  });

  $('#runMigrationBtn', container).addEventListener('click', ()=> runBatchMigration());

  const listBox = $('#batchList', container);
  const unsub = db.collection(COL.batches).onSnapshot(async snap=>{
    const batches = []; snap.forEach(d=> batches.push({id:d.id, ...d.data()}));
    let counts = {};
    try{
      const enrollSnap = await db.collection(COL.enrollments).get();
      enrollSnap.forEach(d=>{ const e=d.data(); if(e.status==='active') counts[e.batchId]=(counts[e.batchId]||0)+1; });
    }catch(e){ console.error(e); }
    listBox.innerHTML = '';
    if(!batches.length){ listBox.appendChild(el(`<div class="empty-state"><div class="icon">📚</div>No batches yet — create one above.</div>`)); return; }
    batches.forEach(b=>{
      const card = el(`<div class="batch-card">
        <div class="batch-card-top">
          <div><div class="batch-name">${esc(b.name)}</div>${b.description?`<div class="batch-desc">${esc(b.description)}</div>`:''}</div>
          <span class="badge ${b.status==='active'?'badge-free':'badge-muted'}">${b.status==='active'?'Active':'Archived'}</span>
        </div>
        <div class="batch-meta-row">
          ${b.class?`<span class="badge badge-accent">Class ${esc(b.class)}</span>`:''}
          <span class="badge badge-accent">👨‍🎓 ${counts[b.id]||0} enrolled</span>
          <span class="badge badge-muted">${b.defaultExpiryType==='lifetime'?'♾ Lifetime default':'📅 Fixed default'}</span>
        </div>
      </div>`);
      card.addEventListener('click', ()=> openBatchDetail(b));
      listBox.appendChild(card);
    });
  });
  trackUnsub(unsub);
}

function openBatchDetail(batch){
  const overlay = el(`<div class="overlay open"><div class="sheet">
    <div class="sheet-handle"></div><button class="sheet-close" id="closeBatch">✕</button><div style="clear:both"></div>
    <div class="card">
      <div class="card-title">📚 ${esc(batch.name)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${esc(batch.description||'No description')}</div>
      <div class="row2">
        <button class="btn ${batch.status==='active'?'btn-danger':'btn-success'}" id="toggleBatchStatus">${batch.status==='active'?'📦 Archive batch':'✅ Reactivate batch'}</button>
        <button class="btn btn-ghost" id="deleteBatchBtn">🗑 Delete batch</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">➕ Enroll a student</div>
      <div class="search-input-wrap"><span class="si">🔍</span><input type="text" id="enrollSearch" placeholder="Search student by name or phone..."></div>
      <div id="enrollSearchResults"></div>
    </div>
    <div class="card">
      <div class="card-title">👨‍🎓 Enrolled students</div>
      <div id="enrollList"><div class="spinner"></div></div>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  $('#closeBatch', overlay).addEventListener('click', ()=> overlay.remove());

  $('#toggleBatchStatus', overlay).addEventListener('click', async ()=>{
    await db.collection(COL.batches).doc(batch.id).update({ status: batch.status==='active'?'archived':'active' });
    toast('Updated'); overlay.remove();
  });
  $('#deleteBatchBtn', overlay).addEventListener('click', async ()=>{
    if(!confirm('Delete this batch? Enrolled students lose this enrollment only — their account, results and payments are untouched.')) return;
    try{
      const enrollSnap = await db.collection(COL.enrollments).where('batchId','==',batch.id).get();
      const affectedStudentIds = []; const dels = [];
      enrollSnap.forEach(d=>{ affectedStudentIds.push(d.data().studentId); dels.push(db.collection(COL.enrollments).doc(d.id).delete()); });
      await Promise.all(dels);
      await db.collection(COL.batches).doc(batch.id).delete();
      await Promise.all(affectedStudentIds.map(id=> syncStudentActiveBatchIds(id)));
      toast('Batch deleted'); overlay.remove();
    }catch(e){ console.error(e); toast('Could not delete — check your connection.'); }
  });

  let allStudents = [];
  db.collection(COL.students).get().then(snap=>{ snap.forEach(d=> allStudents.push({id:d.id, ...d.data()})); }).catch(e=>console.error(e));
  $('#enrollSearch', overlay).addEventListener('input', ()=>{
    const q = $('#enrollSearch',overlay).value.trim().toLowerCase();
    const resultsBox = $('#enrollSearchResults', overlay);
    if(!q){ resultsBox.innerHTML=''; return; }
    const matches = allStudents.filter(s=> (s.fullName||'').toLowerCase().includes(q) || (s.phone||'').includes(q)).slice(0,5);
    resultsBox.innerHTML='';
    matches.forEach(s=>{
      const row = el(`<div class="enroll-row">
        <div class="enroll-info"><div class="enroll-name">${esc(s.fullName)}</div><div class="enroll-meta">${esc(s.phone||'')}</div></div>
        <button class="btn-sm btn-success">+ Enroll</button>
      </div>`);
      $('button', row).addEventListener('click', async ()=>{
        try{
          const existing = await db.collection(COL.enrollments).where('studentId','==',s.id).get();
          let already = false;
          existing.forEach(d=>{ if(d.data().batchId===batch.id) already = true; });
          if(already){ toast('Already enrolled'); return; }
          await db.collection(COL.enrollments).add({
            studentId: s.id, batchId: batch.id, batchName: batch.name,
            status:'active', expiryType: batch.defaultExpiryType||'lifetime', expiresAt: batch.defaultExpiresAt||null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await syncStudentActiveBatchIds(s.id);
          toast('Enrolled ' + s.fullName);
          $('#enrollSearch',overlay).value=''; resultsBox.innerHTML='';
        }catch(e){ console.error(e); toast('Could not enroll — check your connection.'); }
      });
      resultsBox.appendChild(row);
    });
  });

  const enrollListBox = $('#enrollList', overlay);
  const unsub = db.collection(COL.enrollments).where('batchId','==',batch.id).onSnapshot(async snap=>{
    const items = []; snap.forEach(d=> items.push({id:d.id, ...d.data()}));
    enrollListBox.innerHTML = '';
    if(!items.length){ enrollListBox.appendChild(el(`<div class="empty-state">No students enrolled yet.</div>`)); return; }
    for(const e of items){
      let sName = e.studentName || 'Student';
      try{ const sDoc = await db.collection(COL.students).doc(e.studentId).get(); if(sDoc.exists) sName = sDoc.data().fullName; }catch(err){}
      const expTxt = e.expiryType==='lifetime' ? '♾ Lifetime' : ('Expires ' + fmtDate(e.expiresAt));
      const statusBadge = e.status==='active' ? '<span class="badge badge-free">Active</span>'
        : e.status==='suspended' ? '<span class="badge badge-suspended">Suspended</span>'
        : '<span class="badge badge-expired">Expired</span>';

/* One-time, safely re-runnable migration: for every distinct free-text
   `batch` value already on student profiles, create a matching batch
   document (if one doesn't already exist) and enroll that student into
   it with lifetime expiry, so nobody currently active loses access. */
async function runBatchMigration(){
  toast('Running migration…');
  try{
    const studentsSnap = await db.collection(COL.students).get();
    const students = []; studentsSnap.forEach(d=> students.push({id:d.id, ...d.data()}));
    const batchesSnap = await db.collection(COL.batches).get();
    const existingByName = {};
    batchesSnap.forEach(d=>{ existingByName[d.data().name] = d.id; });

    let created = 0, enrolled = 0;
    for(const s of students){
      const name = (s.batch||'').trim();
      if(name){
        let batchId = existingByName[name];
        if(!batchId){
          const ref = await db.collection(COL.batches).add({
            name, description:'', status:'active', defaultExpiryType:'lifetime', defaultExpiresAt:null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          batchId = ref.id;
          existingByName[name] = batchId;
          created++;
        }
        const already = await db.collection(COL.enrollments).where('studentId','==',s.id).get();
        let hasIt = false;
        already.forEach(d=>{ if(d.data().batchId===batchId) hasIt = true; });
        if(!hasIt){
          await db.collection(COL.enrollments).add({
            studentId: s.id, batchId, batchName: name,
            status:'active', expiryType:'lifetime', expiresAt:null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          enrolled++;
        }
      }
      // (Re)sync every student's rules-checkable activeBatchIds from their
      // current enrollments, whether or not this run touched them above —
      // this is what actually gives existing students (created before
      // Phase D.5) working batch access without an admin opening each one
      // individually, and is safe to re-run any time as a resync.
      await syncStudentActiveBatchIds(s.id);
    }
    toast(`Migration done — ${created} batch(es) created, ${enrolled} enrolled, ${students.length} student(s) synced.`);
  }catch(e){
    console.error(e);
    toast('Migration failed — check console.');
  }
}

/* ================================================================
   PERMANENT STUDENT DELETE (admin-only)
   ----------------------------------------------------------------
   Deletes only data OWNED by this one student — never shared teaching
   content (batches/videos/liveClasses/notes/tests/classSchedules/
   classScheduleRules/announcements). The collections below are every
   place in this repo that stores a document keyed by studentId or
   nested under students/{id} (payments) — see COL and the studentId
   grep across index.html/firestore.rules. All existing Security Rules
   for these collections already permit admin delete (allow write /
   allow update, delete: if isAdmin()) — nothing needed changing there.

   Order matters:
   1) Release the device/session lock first (same fields "Reset
      device" already clears) — reuses the existing session-cleanup
      shape rather than inventing a new one.
   2) Delete every OTHER student-owned collection, batched and chunked
      (Firestore's batch limit is 500 ops; 450 leaves headroom).
   3) Delete students/{id} itself LAST. If anything above throws, the
      student doc is still there — visible in the admin list, safely
      retryable — instead of the student silently vanishing from the
      list while orphaned data is left behind.

   This never touches Firebase Authentication (Spark/client-only — see
   the caller for the "Auth account still present" notice) and never
   attempts to auto-recreate a deleted profile — see the
   !studentDoc.exists branch in onAuthStateChanged.
   ================================================================ */
async function permanentlyDeleteStudent(studentId){
  try{
    await db.collection(COL.students).doc(studentId).update({
      deviceId: '', activeSessionId: '', activeDeviceId: '', sessionStartedAt: null
    });
  }catch(e){ console.error('[delete-student] session release failed (continuing):', e); }

  async function deleteAllByQuery(query){
    const snap = await query.get();
    const refs = snap.docs.map(d=>d.ref);
    for(let i=0; i<refs.length; i+=450){
      const batch = db.batch();
      refs.slice(i, i+450).forEach(r=> batch.delete(r));
      await batch.commit();
    }
  }

  await deleteAllByQuery(db.collection(COL.students).doc(studentId).collection(COL.payments));
  await deleteAllByQuery(db.collection(COL.enrollments).where('studentId','==',studentId));
  await deleteAllByQuery(db.collection(COL.testResults).where('studentId','==',studentId));
  await deleteAllByQuery(db.collection(COL.upgradeRequests).where('studentId','==',studentId));
  await deleteAllByQuery(db.collection(COL.batchJoinRequests).where('studentId','==',studentId));

  await db.collection(COL.students).doc(studentId).delete();
}

function ytIdFromUrl(url){
  const m = (url||'').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : (url||'').trim();
}

function openTestResults(t){
  const overlay = el(`<div class="overlay open"><div class="sheet">
    <div class="sheet-handle"></div><button class="sheet-close" id="closeRes">✕</button><div style="clear:both"></div>
    <div class="card-title">📊 ${esc(t.title)} — results</div>
    <div id="resList"><div class="spinner"></div></div>
  </div></div>`);
  document.body.appendChild(overlay);
  $('#closeRes', overlay).addEventListener('click', ()=> overlay.remove());
  db.collection(COL.testResults).where('testId','==',t.id).get().then(snap=>{
    const box = $('#resList', overlay);
    if(snap.empty){ box.innerHTML = '<div class="empty-state">No attempts yet.</div>'; return; }
    let rows = []; snap.forEach(d=> rows.push(d.data()));
    rows.sort((a,b)=> b.score - a.score);
    box.innerHTML='';
    rows.forEach((r,i)=>{
      box.appendChild(el(`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12px">
        <span>#${i+1} ${esc(r.studentName||'Student')}</span><span style="font-weight:700">${esc(r.score)}/${esc(r.total)}</span></div>`));
    });
  });
}

function drawManualBuilder(body){

  body.appendChild(el(`<div>

      </div>
      <div class="row2">
        <div class="field"><label>Option A</label><input id="mOptA"></div>
        <div class="field"><label>Option B</label><input id="mOptB"></div>

        <div class="field"><label>Option D</label><input id="mOptD"></div>
      </div>
      <div class="field"><label>Correct option</label><select id="mCorrectOpt"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>
      <div class="field"><label>Explanation (shown after submit)</label><textarea id="mExplain" placeholder="Why this is the correct answer..."></textarea></div>

    </div>
    <button class="btn btn-primary" id="publishManual">🚀 Generate &amp; publish test</button>
  </div>`));
  loadActiveBatchesInto($('#mBatch', body));

  function refreshQList(){
    $('#qCountLbl',body).textContent = '('+questions.length+' added)';
    const box = $('#mQList',body); box.innerHTML='';
    questions.forEach((q,i)=>{
      const row = el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12px">
        <span>Q${i+1}. ${esc(q.text.slice(0,40))}${q.text.length>40?'…':''}</span><button class="btn-sm btn-danger">🗑</button></div>`);
      $('button',row).addEventListener('click', ()=>{ questions.splice(i,1); refreshQList(); });
      box.appendChild(row);
    });
  }
  $('#addQ',body).addEventListener('click', ()=>{
    const text = $('#mQText',body).value.trim();
    const opts = [$('#mOptA',body).value.trim(), $('#mOptB',body).value.trim(), $('#mOptC',body).value.trim(), $('#mOptD',body).value.trim()];
    if(!text || opts.some(o=>!o)){ toast('Fill question text and all 4 options'); return; }
    questions.push({ text, opts, correct: parseInt($('#mCorrectOpt',body).value), explain: $('#mExplain',body).value.trim() });
    $('#mQText',body).value=''; $('#mOptA',body).value=''; $('#mOptB',body).value=''; $('#mOptC',body).value=''; $('#mOptD',body).value=''; $('#mExplain',body).value='';
    refreshQList(); toast('Question added');
  });
  $('#publishManual',body).addEventListener('click', async ()=>{
    const title = $('#mTitle',body).value.trim();
    if(!title){ toast('Enter a test title'); return; }
    if(!questions.length){ toast('Add at least one question'); return; }
    const batchSel = $('#mBatch',body);
    const batchId = batchSel.value;
    if(!batchId){ toast('Select a batch'); return; }
    const batchName = batchId === GENERAL_BATCH_ID ? 'Free Demo — All Students' : batchSel.selectedOptions[0].textContent;
    const meta = { title, correctMark: parseFloat($('#mCorrect',body).value)||0, wrongMark: parseFloat($('#mWrong',body).value)||0, duration: parseInt($('#mDuration',body).value)||0 };
    const html = buildTestHTML(meta, questions);
    await db.collection(COL.tests).add({
      title, subject: $('#mSubject',body).value.trim(), batchId, batchName,
      type: $('#mType',body).value,
      duration: meta.duration, questionCount: questions.length, htmlContent: html, source: 'manual',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('✅ Test published to Firebase!');
    questions = []; refreshQList(); $('#mTitle',body).value=''; batchSel.value='';
  });
}
