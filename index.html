<meta name="apple-mobile-web-app-title" content="Atomic Minds">
<meta name="mobile-web-app-capable" content="yes">

     FIREBASE — compat SDK (simplest to use from one plain HTML
     file with no build step). Auth + Firestore only — Storage is

     paid Blaze billing account for Storage; notes/assignments

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<style>
/* ============================================================
   ATOMIC MINDS THEME
   Deep purple / near-black, matching the atom+brain brand mark.
   System font stack on purpose — no webfont download, since many
   students are on slow mobile data (seen in your screenshots).
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#12081c;
  --surface:#1c1030;
  --surface-2:#241539;
  --border:#3a2a5c;
  --border-soft:#2a1d47;
  --accent:#9b8ce8;
  --accent-bright:#7f77dd;
  --text:#f3f0fa;
  --text-muted:#a89ae0;
  --text-dim:#7a6da8;
  --success:#4ade80; --success-bg:rgba(34,197,94,.15); --success-brd:rgba(34,197,94,.35);
  --danger:#f87171;  --danger-bg:rgba(239,68,68,.15);  --danger-brd:rgba(239,68,68,.35);
  --warning:#fbbf24; --warning-bg:rgba(245,158,11,.15); --warning-brd:rgba(245,158,11,.35);
  --radius:10px;
  --radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;}
body{min-height:100vh;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
::selection{background:var(--accent-bright);color:#fff}

#app{min-height:100vh;display:flex;flex-direction:column}

/* -------- shared building blocks -------- */
.container{max-width:480px;margin:0 auto;width:100%;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;font-family:inherit}
.field .hint{font-size:11px;color:var(--text-dim);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:11px;border-radius:var(--radius);border:1px solid transparent;font-size:14px;font-weight:600;}
.btn-primary{background:var(--accent-bright);color:#150a1f}
.btn-primary:hover{opacity:.92}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-brd)}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-brd)}
.btn-sm{width:auto;padding:6px 12px;font-size:12px;font-weight:500;border-radius:8px}

.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px}
.badge-free{background:var(--success-bg);color:var(--success)}
.badge-paid{background:var(--warning-bg);color:var(--warning)}
.badge-live{background:var(--danger-bg);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.badge-accent{background:rgba(155,140,232,.15);color:var(--accent)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:24px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:30px;margin-bottom:8px;opacity:.6}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* -------- logo -------- */
.logo-mark{display:block;margin:0 auto}
.brand-row{display:flex;flex-direction:column;align-items:center;text-align:center}
.brand-name{font-size:21px;font-weight:600;color:#fff;letter-spacing:.2px;margin-top:8px}
.brand-tagline{font-size:12px;color:var(--text-muted);margin-top:2px}

/* -------- auth screens -------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:20px;padding:28px 22px}
.auth-tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:12px;margin:22px 0 18px}
.auth-tab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text-dim);transition:all .15s}
.auth-tab.active{background:var(--surface-2);color:#fff;border:1px solid var(--border)}
.auth-error{background:var(--danger-bg);border:1px solid var(--danger-brd);color:var(--danger);
  font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.auth-error.show{display:block}
.auth-link{text-align:center;font-size:12px;color:var(--text-dim);margin-top:14px}
.optional-toggle{text-align:center;font-size:12px;color:var(--accent);margin:6px 0 4px;cursor:pointer;user-select:none}
.optional-fields{display:none;border-top:1px solid var(--border-soft);padding-top:12px;margin-top:4px}
.optional-fields.show{display:block}
.admin-link{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-dim);
  opacity:.6}

/* -------- student shell (bottom tabs) -------- */
.app-shell{display:flex;flex-direction:column;min-height:100vh}
.top-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top-header .logo-mark{margin:0}
.top-header .th-name{font-size:15px;font-weight:600;flex:1}
.content-area{flex:1;padding:16px;padding-bottom:90px;max-width:480px;margin:0 auto;width:100%}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(28,16,48,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);display:flex;z-index:30;max-width:480px;margin:0 auto}
.bottom-nav button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--text-dim);font-size:10px;font-weight:500}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav .bn-icon{font-size:19px}

/* -------- admin shell (top tabs) -------- */
.admin-shell{display:flex;flex-direction:column;min-height:100vh}
.admin-header{position:sticky;top:0;z-index:20;background:rgba(18,8,28,.96);border-bottom:1px solid var(--border-soft);
  padding:12px 16px}
.admin-header-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.admin-tab{padding:7px 13px;border:1px solid var(--border);background:var(--surface-2);border-radius:20px;
  font-size:12px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.admin-tab.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.admin-content{flex:1;padding:16px;max-width:560px;margin:0 auto;width:100%}

/* -------- rich content (MathJax / images / svg) -------- */
.rich-content{font-size:14px;line-height:1.7;color:var(--text)}
.rich-content img{border-radius:8px;margin:8px 0;display:block}
.rich-content svg{max-width:100%}
mjx-container{color:var(--text) !important}

/* -------- item lists reused across tabs -------- */
.item-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:13px;margin-bottom:9px}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--surface-2)}
.item-info{flex:1;min-width:0}
.item-title{font-size:13.5px;font-weight:600}
.item-meta{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.6}
.item-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:14.5px;font-weight:700}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--text-dim);margin-bottom:4px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-size:12.5px;background:var(--surface);border:1px solid var(--border-soft);cursor:pointer}
.cal-day.empty{background:none;border:none;cursor:default}
.cal-day.cal-today{border-color:var(--accent)}
.cal-day.cal-selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent-bright)}
.cal-day.cal-selected .cal-dot{background:#fff}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* -------- modal / overlay -------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;
  overflow-y:auto;padding:16px 16px 28px;transform:translateY(40px);transition:transform .25s;
  border:1px solid var(--border-soft);border-bottom:none}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet-close{position:sticky;top:0;float:right;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-muted);border-radius:8px;padding:5px 10px;font-size:12px}

.tab-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.tab-filter button{padding:6px 13px;border:1px solid var(--border);background:none;border-radius:20px;
  font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.tab-filter button.active{background:rgba(155,140,232,.15);color:var(--accent);border-color:var(--accent)}

.search-input-wrap{position:relative;margin-bottom:10px}
.search-input-wrap input{padding:10px 12px 10px 34px;width:100%;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:none}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px}

/* -------- hamburger + drawer -------- */
.hamburger-btn{background:none;border:none;color:var(--text);font-size:20px;padding:4px 8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px}
.hamburger-btn:active{background:var(--surface-2)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;
  transition:opacity .2s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer-panel{position:absolute;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);
  border-right:1px solid var(--border-soft);transform:translateX(-100%);transition:transform .25s;
  display:flex;flex-direction:column;padding:18px 14px}
.drawer-overlay.open .drawer-panel{transform:translateX(0)}
.drawer-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:10px}
.drawer-brand .bn{font-size:15px;font-weight:700}
.drawer-item{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;border:none;
  background:none;color:var(--text-muted);font-size:14px;font-weight:500;text-align:left;width:100%}
.drawer-item.active{background:rgba(155,140,232,.15);color:var(--accent)}
.drawer-item .di-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.drawer-item .di-badge{margin-left:auto;background:var(--danger-bg);color:var(--danger);font-size:10px;
  font-weight:700;padding:2px 7px;border-radius:20px}
.drawer-divider{height:1px;background:var(--border-soft);margin:8px 4px}
.drawer-footer{margin-top:auto;padding-top:10px}

/* -------- admin home grid dashboard -------- */
.home-welcome{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:16px}
.home-welcome .hw-title{font-size:18px;font-weight:700}
.home-welcome .hw-sub{font-size:12px;color:var(--text-muted);margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  position:relative;transition:border-color .15s}
.home-tile:active{border-color:var(--accent)}
.home-tile .ht-icon{font-size:26px}
.home-tile .ht-label{font-size:13px;font-weight:600;color:var(--text)}
.home-tile .ht-badge{position:absolute;top:10px;right:10px;background:var(--danger-bg);color:var(--danger);
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}

/* -------- upgrade request UI -------- */
.upgrade-banner{background:linear-gradient(135deg,rgba(155,140,232,.18),rgba(127,119,221,.08));
  border:1px solid var(--accent);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;text-align:center}
.upgrade-pending{background:var(--warning-bg);border:1px solid var(--warning-brd);color:var(--warning);
  border-radius:var(--radius);padding:10px 12px;font-size:12.5px;text-align:center;margin-bottom:12px}

/* -------- batches & enrollments -------- */
.batch-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:14px;margin-bottom:9px;cursor:pointer}
.batch-card:active{border-color:var(--accent)}
.batch-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.batch-name{font-size:14.5px;font-weight:700}
.batch-desc{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.batch-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.expiry-toggle{display:flex;gap:6px;margin-bottom:10px}
.expiry-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:var(--radius);font-size:12px;font-weight:600;color:var(--text-dim)}
.expiry-toggle button.active{background:rgba(155,140,232,.18);color:var(--accent);border-color:var(--accent)}
.enroll-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.enroll-row:last-child{border:none}
.enroll-info{flex:1;min-width:0}
.enroll-name{font-size:13px;font-weight:600}
.enroll-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
.badge-suspended{background:var(--warning-bg);color:var(--warning)}
.badge-expired{background:var(--danger-bg);color:var(--danger)}

@media(min-width:481px){
  .content-area,.bottom-nav{max-width:480px}
}
</style>
</head>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="spinner"></div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<button id="pwaInstallBtn" style="position:fixed;top:12px;right:12px;z-index:200;display:none;
  background:#7f77dd;color:#150a1f;border:none;border-radius:20px;padding:8px 15px;
  font-size:12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  📲 Install App
</button>

<script>
/* ================================================================
   1) FIREBASE CONFIG
   ----------------------------------------------------------------
   Paste the config object from Firebase Console → Project settings
   → General → Your apps → SDK setup and configuration.
   This is safe to keep visible here — Firebase is designed for the
   config to be public. Real security comes from firestore.rules
   and storage.rules (separate files provided alongside this one).
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCBdvPx2RBlDJJI8A52hMfColisKEDD8RI",
  authDomain: "atomic-minds-a3017.firebaseapp.com",
  projectId: "atomic-minds-a3017",
  storageBucket: "atomic-minds-a3017.firebasestorage.app",
  messagingSenderId: "1099120272705",
  appId: "1:1099120272705:web:ab8208f91d1bed12bb6dc0"
};

let auth, db;
try{
  if(typeof firebase === 'undefined'){
    throw new Error('SDK_NOT_LOADED');
  }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}catch(initErr){
  console.error('Firebase init failed:', initErr);
  const sdkMissing = initErr && initErr.message === 'SDK_NOT_LOADED';
  const heading = sdkMissing ? 'The Firebase library didn\u2019t load' : 'Could not connect to Firebase';
  const detail = sdkMissing
    ? 'This page is being opened somewhere that blocks loading outside scripts (a local file preview, an in-app viewer, or no internet connection) \u2014 not a code problem.'
    : (initErr && initErr.message ? initErr.message : 'Unknown error');
  const hint = sdkMissing
    ? 'Deploy this folder to Netlify (or any real https host) and open that live link \u2014 Firebase needs a real http/https address, not a file opened locally or through a preview app.'
    : 'Check that this page is served over http/https (not opened by double-clicking the file), and that the firebaseConfig values above match your Firebase project exactly.';
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;color:#f3f0fa;background:#12081c">' +
    '<div><div style="font-size:15px;font-weight:700;margin-bottom:8px">' + heading + '</div>' +
    '<div style="font-size:12px;color:#a89ae0;max-width:320px">' + detail + '</div>' +
    '<div style="font-size:11px;color:#7a6da8;margin-top:14px;max-width:320px">' + hint + '</div>' +
    '</div></div>';
  throw initErr;
}

/* ================================================================
   2) CONSTANTS & SMALL UTILITIES
   ================================================================ */
const COL = {
  students: 'students',
  admins: 'admins',
  videos: 'videos',
  liveClasses: 'liveClasses',
  tests: 'tests',
  testResults: 'testResults',
  notes: 'notes',
  payments: 'payments',
  upgradeRequests: 'upgradeRequests',
  batchJoinRequests: 'batchJoinRequests',
  batches: 'batches',
  enrollments: 'enrollments',
  announcements: 'announcements',
  classSchedules: 'classSchedules',
  classScheduleRules: 'classScheduleRules' // Phase F.2 — recurring weekly schedules

function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){

/* Shared slide-out nav drawer for both the student and admin shells.
   items: [{ key, icon, label, badge?, onSelect }]  activeKey: current key */
function openDrawer(title, items, activeKey){
  const overlay = el(`<div class="drawer-overlay">
    <div class="drawer-panel">
      <div class="drawer-brand">${buildLogo(28)}<span class="bn">${esc(title)}</span></div>
      <div id="drawerItems"></div>
    </div>
  </div>`);
  const list = $('#drawerItems', overlay);
  items.forEach(it=>{
    if(it.divider){ list.appendChild(el(`<div class="drawer-divider"></div>`)); return; }
    const row = el(`<button class="drawer-item ${it.key===activeKey?'active':''}">
      <span class="di-icon">${it.icon}</span><span>${esc(it.label)}</span>
      ${it.badge ? `<span class="di-badge">${esc(it.badge)}</span>` : ''}
    </button>`);
    row.addEventListener('click', ()=>{ closeDrawer(); it.onSelect && it.onSelect(); });
    list.appendChild(row);
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeDrawer(); });
  window.__amDrawerOverlay = overlay;
}
function closeDrawer(){
  const o = window.__amDrawerOverlay;
  if(!o) return;
  o.classList.remove('open');
  setTimeout(()=> o.remove(), 200);
  window.__amDrawerOverlay = null;
}

/* Renders text that may contain LaTeX ($...$), raw <img>, or raw <svg>.
   Used for every question, solution, note description, admin note, etc.
   A light allow-list strips <script> tags but keeps img/svg/formatting
   so admin can paste chemistry structure images or hand-drawn SVGs. */
function renderRich(container, raw){
  if(!raw){ container.innerHTML=''; return; }
  const cleaned = String(raw).replace(/<script[\s\S]*?<\/script>/gi,'');
  container.innerHTML = cleaned;
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([container]).catch(()=>{});
  }
}

/* A random ID generated once per browser/device and stored in localStorage,
   used to identify "this browser" to the active-session system below (see
   AUTH ACTIONS). It is NOT itself a login lock — it's just this device's
   fingerprint; students/{uid}.activeDeviceId is the temporary lock, and it
   is released on logout or after a period of inactivity, not tied
   permanently to any one device.
   Wrapped defensively: some browser contexts (strict private-browsing
   modes, certain in-app browsers) can block localStorage entirely — if
   that happens we fall back to a session-only id instead of crashing. */
function getDeviceId(){
  try{
    let id = localStorage.getItem('am_device_id');
    if(!id){
      id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('am_device_id', id);
    }
    return id;
  }catch(e){
    console.error('[device-lock] localStorage unavailable, using a session-only id:', e);
    if(!window.__amFallbackDeviceId){
      window.__amFallbackDeviceId = 'dev_fallback_' + Math.random().toString(36).slice(2);
    }
    return window.__amFallbackDeviceId;
  }
}

function friendlyAuthError(err){
  const code = err && err.code || '';
  const map = {
    'auth/email-already-in-use':'This email is already registered — try logging in instead.',
    'auth/invalid-email':'Enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/user-not-found':'No account found with this email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts. Please wait a bit and try again.',
    'permission-denied':'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.'
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* Title+body version used by the login forms (student + admin), so a
   failure reads as a clear two-line message ("Login failed" / "Incorrect
   email or password.") inside the app's own error box — never a bare
   browser alert(), and never something a Chrome password-manager popup
   can be mistaken for. Our own hand-thrown errors (deactivated, device
   locked, account not found, etc.) already carry a ready-to-show
   err.title; anything else is matched by Firebase's auth/* error code. */
function authErrorDisplay(err){
  if(err && err.title){
    return { title: err.title, body: (err.message || '') };
  }
  const code = err && err.code || '';
  const map = {
    'auth/wrong-password':         { title:'Login failed', body:'Incorrect email or password.' },
    'auth/invalid-credential':     { title:'Login failed', body:'Incorrect email or password.' },
    'auth/user-not-found':         { title:'Account not found', body:'No account found with this email.' },
    'auth/invalid-email':          { title:'Login failed', body:'Enter a valid email address.' },
    'auth/user-disabled':          { title:'Account deactivated', body:'Your account has been deactivated. Please contact your teacher.' },
    'auth/too-many-requests':      { title:'Too many attempts', body:'Please wait a bit and try again.' },
    'auth/network-request-failed': { title:'Login temporarily unavailable', body:'Please check your internet connection and try again.' },
    'permission-denied':           { title:'Permission error', body:'Your account doesn\u2019t have permission for this yet \u2014 if you just set this up, make sure firestore.rules has been published in the Firebase console.' }
  };
  if(map[code]) return map[code];
  return { title:'Login failed', body:(err && err.message) || 'Something went wrong. Please try again.' };
}

/* ================================================================
   6) AUTH ACTIONS
   ----------------------------------------------------------------
   ACTIVE-SESSION SYSTEM (one student device at a time)
   Replaces the old permanent "deviceId lock" with an explicit claim:
     students/{uid}.activeSessionId   — random id for the current login
     students/{uid}.activeDeviceId    — which browser/device holds it
     students/{uid}.sessionStartedAt  — server timestamp, informational
   The session stays active until the student explicitly logs out, or an
   admin uses Reset Device — there is NO stale-session timeout and NO
   heartbeat. A forgotten-open browser is only ever freed up by Reset
   Device, by design. The old "deviceId" field is left in place for
   backward compatibility but is no longer read as a lock anywhere.
   ================================================================ */
function newSessionId(){
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

/* This browser tab's record of which session it currently holds, so a
   page reload can tell "is the lock still mine?" without guessing, and a
   logout can avoid ever clearing a session it doesn't own. Kept in
   sessionStorage (per-tab, cleared when the tab/window closes) rather
   than localStorage, deliberately: it should NOT survive into a brand
   new tab the way the device id does. */
function getLocalSessionId(){
  try{ return sessionStorage.getItem('am_session_id') || null; }
  catch(e){ return CURRENT_SESSION_ID; }
}
function setLocalSessionId(id){
  try{
    if(id) sessionStorage.setItem('am_session_id', id);
    else sessionStorage.removeItem('am_session_id');
  }catch(e){ console.error('[session] sessionStorage unavailable (non-blocking):', e); }
}

/* Attempts to claim (or silently confirm) this device's exclusive active
   session for a student, inside a Firestore transaction so two
   near-simultaneous logins on different devices can't both succeed.
   - If a DIFFERENT device already holds the session, throws
     { code:'device-locked', message } — the one real, intended block.
     There is no staleness check — only an explicit logout or an admin
     Reset Device ever frees this up.
   - If the same device already holds it (another tab, or resuming after
     the browser was fully closed), or there's no active session at all
     (including old documents that don't have these fields yet), claims
     it for this device and returns its id.
   Returns the session id this device now holds. */
async function claimStudentSession(uid, myDevice){
  const ref = db.collection(COL.students).doc(uid);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if(!snap.exists){
      throw { code:'', title:'Account not found', message:'Student record not found.' };
    }
    const data = snap.data();
    const sameDevice = !!data.activeDeviceId && data.activeDeviceId === myDevice;

    if(data.activeSessionId && !sameDevice){
      throw { code:'device-locked', title:'Already logged in on another device', message:'This account is currently logged in on another device. Please log out from that device first, or ask your teacher to reset your device.' };
    }
    if(sameDevice && data.activeSessionId){
      // Already this device's session (a second tab, or resuming after a
      // reload) — nothing to change.
      return data.activeSessionId;
    }
    // No active session at all — claim it fresh. This also auto-migrates
    // old student documents that never had these fields.
    const sid = newSessionId();
    tx.update(ref, {
      activeSessionId: sid,
      activeDeviceId: myDevice,
      sessionStartedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return sid;
  });
}

/* Clears the active-session fields ONLY if they still belong to this
   browser/session — never another device's, and never a different tab's
   newer claim on the same device. Never throws (logout must always be
   able to proceed even if this fails). */
async function releaseStudentSession(uid, myKnownSessionId){
  if(!myKnownSessionId) return;
  try{
    await db.runTransaction(async (tx) => {
      const ref = db.collection(COL.students).doc(uid);
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const data = snap.data();
      if(data.activeSessionId && data.activeSessionId === myKnownSessionId){
        tx.update(ref, {
          activeSessionId: '', activeDeviceId: '', sessionStartedAt: null
        });
      }
      // else: a different device/tab now owns the session — leave it alone.
    });
  }catch(e){
    console.error('[session] failed to release session on logout (non-blocking):', e);
  }
}

async function doRegister(data){
  const cred = await auth.createUserWithEmailAndPassword(data.email, data.password);
  const uid = cred.user.uid;
  await db.collection(COL.students).doc(uid).set({
    fullName: data.fullName,
    email: data.email,
    phone: data.phone,
    class: data.class || '',
    batch: data.batch || '',
    location: data.location || '',
    school: data.school || '',
    dob: data.dob || '',
    guardianName: data.guardianName || '',
    guardianPhone: data.guardianPhone || '',
    membership: 'free',
    membershipExpiry: null,
    active: true,
    deviceId: getDeviceId(),
    activeBatchIds: [GENERAL_BATCH_ID],
    watchMinutes: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Sign back out immediately rather than silently auto-logging them in —
  // show a clear success message and send them to the Log in tab instead.
  // (Flags are set *before* signOut() because the auth-state listener's
  // re-render can fire while signOut() is still resolving.)
  STATE.authMode = 'login';
  STATE.justRegistered = true;
  await auth.signOut();
}

async function doLogin(email, password){
  LOGIN_IN_PROGRESS = true;
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    let doc;
    try{
      doc = await db.collection(COL.students).doc(uid).get();
    }catch(fetchErr){
      console.error('[login] could not load student record:', fetchErr);
      await auth.signOut();
      throw { code:'', title:'Login temporarily unavailable', message:'Please check your internet connection and try again.' };
    }
    if(!doc.exists){
      console.error('[login] signed in OK but no students/'+uid+' document exists.');
      await auth.signOut();
      throw { code:'', title:'Account not found', message:'No student account was found for this login. Are you trying the admin login instead?' };
    }
    const data = doc.data();
    if(data.active === false){
      await auth.signOut();
      const reasonSuffix = data.deactivationReason ? ` Reason: ${data.deactivationReason}` : '';
      throw { code:'', title:'Account deactivated', message:`Your account has been deactivated.${reasonSuffix} Please contact your teacher.` };
    }
    // Active-session (one-device) check — hardened the same way the old
    // device-lock check was: only a CONFIRMED conflicting session on
    // another device blocks login. A problem with the check itself
    // (offline, a failed transaction) must never lock a legitimate
    // student out, so it's logged and the login is allowed through.
    const myDevice = getDeviceId();
    try{
      const sid = await claimStudentSession(uid, myDevice);
      CURRENT_SESSION_ID = sid;
      setLocalSessionId(sid);
    }catch(sessionErr){
      if(sessionErr && sessionErr.code === 'device-locked'){
        await auth.signOut();
        throw { code:'', title:'Already logged in on another device', message: sessionErr.message };
      }
      console.error('[session] claim failed unexpectedly, allowing login anyway:', sessionErr);
      CURRENT_SESSION_ID = null;
      setLocalSessionId(null);
    }
    // Route straight to the dashboard ourselves, rather than waiting on
    // onAuthStateChanged, so a deactivated or device-locked account can
    // never flash the dashboard for an instant before being signed back out.
    CURRENT_USER = cred.user;
    CURRENT_ROLE = 'student';
    CURRENT_PROFILE = data;
    STATE.screen = 'student';
    renderScreen();
    startAnnouncementNotifications();
  } finally {
    LOGIN_IN_PROGRESS = false;
  }
}

async function doAdminLogin(email, password){
  const cred = await auth.signInWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  const doc = await db.collection(COL.admins).doc(uid).get();
  if(!doc.exists){
    await auth.signOut();
    throw { code:'', title:'Not authorized', message:'This account is not authorized as admin.' };
  }
  // onAuthStateChanged will pick this up and route to the admin app.
}

async function doLogout(){
  const user = auth.currentUser;
  if(user && CURRENT_ROLE === 'student'){
    await releaseStudentSession(user.uid, CURRENT_SESSION_ID || getLocalSessionId());
  }
  CURRENT_SESSION_ID = null;
  setLocalSessionId(null);
  stopAnnouncementNotifications();
  auth.signOut();
}

/* ================================================================
   BROWSER NOTIFICATIONS (Phase H)
   ----------------------------------------------------------------
   Foreground-only, Firestore-listener-driven browser notifications.
   No FCM, no push server, no service worker involved — deliberately:
   this only ever fires while the TMS tab is open and this listener is
   live (same lifetime as every other real-time feature in this app),
   so a plain page-level Notification works for both showing and
   click-handling (its own onclick just focuses this window — see
   showAnnouncementNotification()). This app has no URL router, so
   "focus the TMS" is the full extent of the click destination, which
   is explicitly an acceptable outcome for a single-page app like this
   one. (service-worker.js itself was not part of this change — see
   the phase report for why extending it wasn't necessary here.)

   Lifecycle: started once per login (doLogin() and the resumed-session
   branches of onAuthStateChanged() below both call
   startAnnouncementNotifications(), which is idempotent), stopped on
   doLogout() and on the top-level "signed out" branch of
   onAuthStateChanged() — so it also stops for every OTHER sign-out
   path (deactivated, device-locked, deleted student), without having
   to duplicate the stop call in each of those branches individually.
   Deliberately NOT registered via trackUnsub()/clearUnsubs(): those
   are torn down and rebuilt on every single tab switch (see
   renderScreen()), which would otherwise silently kill this listener
   the moment a student opened, say, the Classes tab.
   ================================================================ */
let NOTIF_UNSUB = null;
let NOTIF_META_UNSUB = null; // [NOTIF DEBUG - TEMP] separate diagnostic-only listener, see startAnnouncementNotifications()

function notificationSupport(){ return 'Notification' in window; }

/* Only ever called from the explicit "Enable Notifications" button in
   Settings (Part C) — never on page load / login, so a student is
   never prompted just for opening the app. Never re-prompts once
   denied — the browser wouldn't show a popup for that anyway, but this
   also skips the pointless call entirely and just reports the state. */
async function requestNotificationPermission(){
  if(!notificationSupport()) return 'unsupported';
  if(Notification.permission === 'granted') return 'granted';
  if(Notification.permission === 'denied') return 'denied';
  try{ return await Notification.requestPermission(); }
  catch(e){ console.error('[notifications] permission request failed:', e); return Notification.permission; }
}

/* Shows one native browser notification for a newly-received
   announcement — never for the initial/already-seen backlog, see
   startAnnouncementNotifications(). Suppressed while the tab is the
   one the student is actively looking at (Part J): the in-app
   announcement UI already covers that case, so a browser notification
   on top would just be a redundant duplicate, not a missed one.

   PHASE H FIX: displays via the existing Service Worker registration's
   registration.showNotification() instead of the page-level
   `new Notification(...)` constructor — Android Chrome / an installed
   Android PWA rejects that constructor outright ("Illegal constructor"),
   which is what the Phase H diagnostic traced this to. service-worker.js
   itself is untouched — this only calls the standard showNotification()
   API on the registration that index.html already creates via
   navigator.serviceWorker.register('service-worker.js'). Click handling
   is intentionally NOT wired up yet (that needs a notificationclick
   listener inside service-worker.js itself, deferred to a later phase
   per this fix's scope) — clicking the notification will simply do
   nothing for now, same as before this fix in the case where it never
   even displayed. */
/* ================================================================
   [NOTIF DEBUG - TEMP] Visible on-screen diagnostic panel
   ----------------------------------------------------------------
   Console output is impractical to check mid real-device test (no
   cable/remote-debug session handy while the tab is backgrounded), so
   this mirrors the exact same diagnostic messages into a small fixed
   panel. Appended directly to document.body — a SIBLING of #app, not
   a child of it — because renderScreen() does app.innerHTML='' on
   every single screen/tab change (see renderScreen() above), which
   would otherwise wipe this panel out on the very next navigation.
   Purely observational: does not touch the Firestore listener,
   dedup/baseline logic, or notification display logic — every call
   site below still runs exactly the same as before, this just also
   reports what happened. console.log is kept alongside it too, in
   case remote devtools happen to be available. Diagnostic-only —
   remove this whole block (and the notifDebugLog() calls that use it)
   once real-device testing is done.
   ================================================================ */
const NOTIF_DEBUG_LOG = [];
function notifDebugLog(msg){
  console.log('[NOTIF DEBUG]', msg);
  NOTIF_DEBUG_LOG.unshift(new Date().toLocaleTimeString() + '  ' + msg); // newest first — readable without scrolling on a phone
  if(NOTIF_DEBUG_LOG.length > 30) NOTIF_DEBUG_LOG.length = 30;
  renderNotifDebugPanel();
}
function renderNotifDebugPanel(){
  let panel = document.getElementById('notifDebugPanel');
  if(!panel){
    panel = el(`
      <div id="notifDebugPanel" style="position:fixed;left:0;right:0;bottom:0;z-index:99999;max-height:38vh;overflow-y:auto;
        background:rgba(10,5,20,.94);color:#c9ffcf;font:10px/1.4 ui-monospace,Menlo,Consolas,monospace;
        padding:6px 8px 8px;border-top:1px solid #3a2a5c;-webkit-overflow-scrolling:touch">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;position:sticky;top:0;background:rgba(10,5,20,.94);padding-bottom:4px">
          <span style="color:#9b8ce8;font-weight:700;letter-spacing:.5px">NOTIF DEBUG</span>
          <button id="notifDebugClearBtn" style="background:#3a2a5c;color:#f3f0fa;border:none;border-radius:6px;padding:3px 8px;font-size:10px">Clear Debug</button>
        </div>
        <div id="notifDebugList"></div>
      </div>
    `);
    document.body.appendChild(panel); // sibling of #app — survives renderScreen()'s app.innerHTML=''
    $('#notifDebugClearBtn', panel).addEventListener('click', ()=>{
      NOTIF_DEBUG_LOG.length = 0;
      renderNotifDebugPanel();
    });
  }
  const list = $('#notifDebugList', panel);
  list.innerHTML = NOTIF_DEBUG_LOG.length
    ? NOTIF_DEBUG_LOG.map(l => '<div style="padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06);word-break:break-word">'+esc(l)+'</div>').join('')
    : '<div style="opacity:.5">(no messages yet)</div>';
}

function showAnnouncementNotification(a){
  // [PHASE H DEBUG - TEMP] keeping these for this fix's own validation pass; strip once confirmed working on Android
  console.log('[PHASE H DEBUG] showAnnouncementNotification() called for id=', a.id, {
    supported: notificationSupport(),
    permission: (typeof Notification!=='undefined') ? Notification.permission : '(no Notification global)',
    visibilityState: document.visibilityState
  });
  notifDebugLog('showAnnouncementNotification() called: ' + a.id); // [NOTIF DEBUG - TEMP]
  if(!notificationSupport() || Notification.permission !== 'granted'){
    console.log('[PHASE H DEBUG] bailing: not supported or permission not granted');
    notifDebugLog('skipped (permission not granted): ' + a.id + ' perm=' + ((typeof Notification!=='undefined') ? Notification.permission : 'n/a')); // [NOTIF DEBUG - TEMP]
    return;
  }
  if(document.visibilityState === 'visible'){
    console.log('[PHASE H DEBUG] bailing: document.visibilityState is "visible" (TMS tab is the foregrounded tab)');
    notifDebugLog('skipped (visible/foreground): ' + a.id); // [NOTIF DEBUG - TEMP]
    return;
  }
  if(!('serviceWorker' in navigator)){
    // Same fallback shape as the existing SW-registration guard elsewhere
    // in this file — a browser with Notification support but no Service
    // Worker support is effectively theoretical for this app's targets,
    // but bail cleanly rather than let navigator.serviceWorker throw.
    console.log('[PHASE H DEBUG] bailing: no serviceWorker support in this browser');
    notifDebugLog('skipped (no serviceWorker support): ' + a.id); // [NOTIF DEBUG - TEMP]
    return;
  }
  const title = a.title || 'Atomic Minds';
  const body = a.message || ('New announcement' + (a.batchName ? (' for ' + a.batchName) : ''));
  console.log('[PHASE H DEBUG] attempting registration.showNotification() now, title=', title, 'body=', body);
  notifDebugLog('Waiting for serviceWorker.ready: ' + a.id); // [NOTIF DEBUG - TEMP]
  navigator.serviceWorker.ready
    .then(registration => {
      // [NOTIF DEBUG - TEMP]
      notifDebugLog('ready resolved, active.state=' + (registration.active ? registration.active.state : 'NO ACTIVE WORKER') + ': ' + a.id);
      notifDebugLog('Calling showNotification(): ' + a.id);
      return registration.showNotification(title, {
        body,
        tag: 'ann-' + a.id // same id -> same OS notification slot; belt-and-suspenders against a duplicate ever stacking
      });
    })
    .then(()=>{
      console.log('[PHASE H DEBUG] registration.showNotification() succeeded');
      notifDebugLog('showNotification() SUCCEEDED: ' + a.id); // [NOTIF DEBUG - TEMP]
    })
    .catch(error => {
      console.log('[PHASE H DEBUG] registration.showNotification() THREW:', error && error.name, error && error.message);
      console.error('[Phase H] Service Worker notification failed:', error);
      notifDebugLog('showNotification() FAILED: ' + a.id + '  ' + (error && error.name) + ': ' + (error && error.message)); // [NOTIF DEBUG - TEMP]
    });
}

/* Idempotent — safe to call from both doLogin() and a resumed session
   without double-attaching (NOTIF_UNSUB already set = already running).
   Runs regardless of current Notification.permission: the listener
   itself is just the same Firestore read every other tab already does,
   and showAnnouncementNotification() is what actually gates on
   permission — kept this way so a student who enables notifications
   mid-session (Settings tab) starts getting them immediately, with
   nothing here needing to notice that change or restart anything. */
function startAnnouncementNotifications(){
  if(NOTIF_UNSUB){
    console.log('[PHASE H DEBUG] startAnnouncementNotifications() called but NOTIF_UNSUB already set — skipping duplicate attach'); // [PHASE H DEBUG - TEMP]
    return;
  }
  console.log('[PHASE H DEBUG] startAnnouncementNotifications() called — resolving batch ids...'); // [PHASE H DEBUG - TEMP]
  let seenIds = null; // null = first snapshot not processed yet
  syncAndGetMyBatchIds().then(ids=>{
    console.log('[PHASE H DEBUG] syncAndGetMyBatchIds resolved:', ids, 'NOTIF_UNSUB already set?', !!NOTIF_UNSUB); // [PHASE H DEBUG - TEMP]
    if(!ids.length || NOTIF_UNSUB) return; // logged out (or already started elsewhere) while this was resolving
    NOTIF_UNSUB = listenContentByBatchIds(COL.announcements, ids, {field:'active', value:true}, items=>{
      console.log('[PHASE H DEBUG] announcement snapshot received, count=', items.length, 'baseline already set?', seenIds!==null); // [PHASE H DEBUG - TEMP]
      if(seenIds === null){
        // First delivery after (re)attaching is the existing backlog, not
        // "new" — mark it all seen and never notify for it (Part G).
        items.forEach(a=>{ // [NOTIF DEBUG - TEMP]
          notifDebugLog('Announcement received: ' + a.id);
          notifDebugLog('skipped (initial snapshot/baseline): ' + a.id);
        });
        seenIds = new Set(items.map(a=>a.id));
        console.log('[PHASE H DEBUG] baseline established with', seenIds.size, 'existing announcement id(s):', Array.from(seenIds)); // [PHASE H DEBUG - TEMP]
        return;
      }
      items.forEach(a=>{
        notifDebugLog('Announcement received: ' + a.id); // [NOTIF DEBUG - TEMP]
        if(seenIds.has(a.id)){
          notifDebugLog('skipped (duplicate id): ' + a.id); // [NOTIF DEBUG - TEMP]
          return; // already-known doc re-delivered — reconnect/metadata-only change/etc. (Part F)
        }
        console.log('[PHASE H DEBUG] NEW announcement id detected:', a.id, a.title); // [PHASE H DEBUG - TEMP]
        notifDebugLog('Passed baseline/dedup check: ' + a.id); // [NOTIF DEBUG - TEMP]
        seenIds.add(a.id);
        showAnnouncementNotification(a);
      });
    }, err=> console.error('[notifications] announcement listener failed:', err));
    console.log('[PHASE H DEBUG] listenContentByBatchIds() attached, NOTIF_UNSUB is now', typeof NOTIF_UNSUB); // [PHASE H DEBUG - TEMP]

    // [NOTIF DEBUG - TEMP] Snapshot-metadata diagnostic — a SEPARATE,
    // independent raw onSnapshot listener, entirely additional to (not a
    // modification of) the real notification listener above or of
    // listenContentByBatchIds() itself, which is shared by every other
    // tab in this app and is not touched here. Exists only to surface
    // snapshot.metadata.fromCache / hasPendingWrites, which
    // listenContentByBatchIds() discards after extracting .docs and so
    // is otherwise unobservable. Mirrors the same query shape (batchId
    // in the first up-to-30 ids, active==true) as the first — and for
    // any real student, only — chunk that listener uses, so the metadata
    // reported here is representative of the same data.
    if(NOTIF_META_UNSUB){ try{ NOTIF_META_UNSUB(); }catch(e){} }
    NOTIF_META_UNSUB = db.collection(COL.announcements)
      .where('batchId','in', ids.slice(0,30))
      .where('active','==', true)
      .onSnapshot(snap=>{
        notifDebugLog('SNAPSHOT META: fromCache=' + snap.metadata.fromCache + '  hasPendingWrites=' + snap.metadata.hasPendingWrites + '  docs=' + snap.size);
      }, err=>{ console.error('[notifications] metadata diagnostic listener failed:', err); });
  });
}

function stopAnnouncementNotifications(){
  if(NOTIF_UNSUB){
    console.log('[PHASE H DEBUG] stopAnnouncementNotifications() — tearing down listener'); // [PHASE H DEBUG - TEMP]
    try{ NOTIF_UNSUB(); }catch(e){} NOTIF_UNSUB = null;
  }
  if(NOTIF_META_UNSUB){ try{ NOTIF_META_UNSUB(); }catch(e){} NOTIF_META_UNSUB = null; } // [NOTIF DEBUG - TEMP]
}

/* ================================================================
   7) AUTH STATE LISTENER — decides which screen to show
   ================================================================ */
auth.onAuthStateChanged(async (user) => {
  CURRENT_USER = user;
  if(!user){
    CURRENT_PROFILE = null; CURRENT_ROLE = null;
    CURRENT_SESSION_ID = null;
    stopAnnouncementNotifications();
    STATE.screen = 'auth';
    renderScreen();
    return;
  }
  if(LOGIN_IN_PROGRESS){
    // doLogin() is actively validating this exact sign-in and will route
    // to the right screen itself once it finishes — skip here so a
    // not-yet-approved login can never flash the dashboard before being
    // signed back out (see doLogin above).
    return;
  }
  try{
    const adminDoc = await db.collection(COL.admins).doc(user.uid).get();
    if(adminDoc.exists){
      CURRENT_ROLE = 'admin';
      CURRENT_PROFILE = adminDoc.data();
      STATE.screen = 'admin';
      renderScreen();
      return;
    }
    const studentDoc = await db.collection(COL.students).doc(user.uid).get();
    if(studentDoc.exists && studentDoc.data().active !== false){
      const data = studentDoc.data();
      // A resumed session (page load/reload, or the PWA waking back up,
      // not a fresh password login — doLogin already handled that case
      // above). Confirm this device still legitimately holds the active
      // session before letting it back into the dashboard.
      const myDevice = getDeviceId();
      try{
        const sid = await claimStudentSession(user.uid, myDevice);
        CURRENT_SESSION_ID = sid;
        setLocalSessionId(sid);
        CURRENT_ROLE = 'student';
        CURRENT_PROFILE = data;
        STATE.screen = 'student';
        renderScreen();
        startAnnouncementNotifications();
      }catch(sessionErr){
        if(sessionErr && sessionErr.code === 'device-locked'){
          CURRENT_SESSION_ID = null; setLocalSessionId(null);
          toast('Logged out — this account signed in on another device.');
          await auth.signOut();
        }else{
          console.error('[session] resume check failed, allowing session anyway:', sessionErr);
          CURRENT_ROLE = 'student';
          CURRENT_PROFILE = data;
          STATE.screen = 'student';
          renderScreen();
          startAnnouncementNotifications();
        }
      }
      return;
    }
    // Neither admin nor active student — bounce back to login.
    if(!studentDoc.exists){
      // Permanent Delete case: the Firebase Auth account still works, but
      // its students/{uid} profile is gone. Never auto-recreate it —
      // just reject and tell them why, same as a fresh doLogin() attempt
      // against a missing doc already does.
      toast('This student account is no longer registered. Please contact the administrator.');
    }
    await auth.signOut();
  }catch(e){
    console.error(e);
    await auth.signOut();
  }
});

/* ================================================================
   8) LIVE-LISTENER CLEANUP
   ----------------------------------------------------------------
   Every onSnapshot() started while building a screen is registered
   here, and cleared right before the next full re-render — so
   switching tabs never leaves old Firestore listeners running.
   ================================================================ */
STATE.unsubs = [];
function trackUnsub(fn){ STATE.unsubs.push(fn); }
function clearUnsubs(){ STATE.unsubs.forEach(u=>{ try{ u(); }catch(e){} }); STATE.unsubs = []; }

  const shell = el(`<div class="app-shell">
    <div class="top-header">
      <button class="hamburger-btn" id="studentHamburger">☰</button>
      ${buildLogo(26)}
      <div class="th-name">${BRAND.name}</div>
    </div>
    <div class="content-area" id="studentContent"></div>
    <div class="bottom-nav" id="studentNav">
      <button data-tab="dashboard"><span class="bn-icon">🏠</span>Dashboard</button>

      <button data-tab="tests"><span class="bn-icon">📝</span>Tests</button>
      <button data-tab="notes"><span class="bn-icon">📄</span>Notes</button>
      <button data-tab="announcements"><span class="bn-icon">📢</span>Announcements</button>
    </div>
  </div>`);
  $('#studentHamburger', shell).addEventListener('click', ()=> openStudentDrawer());

  else if(STATE.studentTab==='classes') renderClassesTab(contentEl);
  else if(STATE.studentTab==='tests') renderTestsTab(contentEl);
  else if(STATE.studentTab==='notes') renderNotesTab(contentEl);
  else if(STATE.studentTab==='announcements') renderAnnouncementsTab(contentEl);
  else if(STATE.studentTab==='calendar') renderCalendarTab(contentEl);
  else if(STATE.studentTab==='profile') renderProfileTab(contentEl);
  $all('#studentNav button', shell).forEach(b=> b.classList.toggle('active', b.dataset.tab===STATE.studentTab));
  $('#studentNav', shell).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    STATE.studentTab = b.dataset.tab;
    renderScreen();
  });
  return shell;
}

function renderDashboardTab(container){
  const p = CURRENT_PROFILE;
  const first = (p.fullName||'Student').split(' ')[0];
  container.appendChild(el(`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">

      </div>
      <div id="dashBatchLine" style="font-size:12px;color:var(--text-muted)">Loading your batch…</div>
    </div>
  `));
  const batchLine = $('#dashBatchLine', container);
  const availBox = el(`<div id="availBatchArea"></div>`);
  container.appendChild(availBox);
  const unsub = db.collection(COL.enrollments).where('studentId','==',CURRENT_USER.uid).onSnapshot(snap=>{
    const active = []; snap.forEach(d=>{ const e=d.data(); if(e.status==='active') active.push(e); });

  trackUnsub(unsub);
  const links = el(`
    <div class="card">
      <div class="card-title">📌 Quick links</div>
      <div style="display:flex;flex-direction:column;gap:8px">
